# Owned by tests/workflow_contracts/nextest_timeout_test.py, which proves the
# tier chain, and nextest_target_discovery_test.py, which proves the override
# filter names a target `cargo metadata` discovers. A renamed or moved target
# must fail those contracts rather than fall back to the default allowance.
[profile.default]
# Match the coverage action's default policy for the runtime suite. The
# coverage invocation sets cfg(coverage), so the compile-time harnesses are
# compiled out there; this file governs noncoverage nextest runs.
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
global-timeout = "10m"

[[profile.default.overrides]]
# The filter must name a package, binary and test that Cargo actually builds.
# 60s x 8 rather than 480s x 1: nextest reports SLOW at each period, so an
# overrun reports elapsed time before it is terminated.
filter = 'package(=wireframe) & binary(=compile_error) & test(=compile_tests)'
slow-timeout = { period = "60s", terminate-after = 8, grace-period = "5s" }
