[package]
name = "wireframe_testing"
version = "0.4.0-alpha1"
edition = "2024"
rust-version = "1.95"
description = "Helper utilities for exercising Wireframe applications in tests"
license = "ISC"
repository = "https://github.com/leynos/wireframe"
readme = "README.md"
keywords = ["async", "networking", "binary-protocol", "protocol", "tokio"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/wireframe_testing"

[features]
# Measurement helpers for the runtime-ownership hot paths need Wireframe's
# test-support fixtures (connection startup) and client pool. They stay behind a
# feature so a plain `cargo check -p wireframe_testing` still works against the
# crate's default feature set.
runtime-benchmarks = ["wireframe/test-support", "wireframe/pool"]
# Helpers for the middleware, request-hook, and outbound-encode benchmark
# stages. They need Wireframe's test-support entry points and the copied-byte
# counters, so they stay behind a feature of their own.
pipeline-benchmarks = ["wireframe/test-support", "wireframe/benchmark-counters"]

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util", "net", "sync", "time"] }
wireframe = { version = "0.4.0-alpha1", path = "..", features = ["testkit"] }
bincode = "^2.0"
bytes = "^1.0"
thiserror = "2.0.16"
rstest = "0.27.0"
logtest = "2"
log = "0.4"
metrics = "0.24.3"
metrics-util = "0.20"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1.89"
# Instrumenting global allocator used by the allocation benchmark binaries. The
# wrapper is safe to install: it forwards to the system allocator and counts
# through atomics, so the benchmarks need no `unsafe` code of their own.
stats_alloc = "0.1.10"

[dev-dependencies]
# Serializes the tests that assert on process-global state. `serial_test` is
# already the repository's convention for this; see `tests/push_policies.rs`.
serial_test = "4.0.1"
trybuild = "1"
# Property coverage for the allocation-window arithmetic, which is pure and
# therefore cheap to exercise over the full `usize` range.
proptest = "1.7.0"
