[package]
name = "wireframe-feature-gate"
version = "0.0.0"
edition = "2024"
publish = false

# A standalone package, deliberately absent from the repository workspace.
#
# `make test-feature-gate` must prove that `pool_size` and `slot_id` exist only
# under `test-support`. Trybuild cannot: it forwards the harness's own feature
# list to its fixture, and the root manifest's `wireframe_testing` development
# dependency enables `runtime-benchmarks`, which enables `wireframe/test-support`
# (`wireframe_testing/Cargo.toml`). Every trybuild fixture therefore has the
# accessors. A separate package that depends on `wireframe` alone has no such
# unification, so its `[features]` table decides whether the accessors exist.
#
# `[workspace]` is empty on purpose: it stops Cargo from walking up to the
# repository manifest and inheriting the members and lints above. The package is
# compiled by `scripts/check-feature-gate.sh`, never by workspace-wide gates.
#
# It must also resolve `tokio-util` independently of the root lock, so its
# `Cargo.lock` is ignored (`.gitignore`) and Dependabot is not pointed at it:
# pinning the resolution would hide the very regression the gate exists to
# catch. Hence the two records below.
#
# nested-cargo-allow: lock resolves independently of the root lock on purpose; no lock is committed
# nested-cargo-allow: manifest dependency pins would not change what the gate proves, and no lock is committed
[workspace]

[dependencies]
# `metrics` is deliberately absent: `src/request/mod.rs` uses
# `tokio_util::io`, so this consumer fails to compile unless the root manifest
# declares that feature on `tokio-util` itself rather than inheriting it from a
# default feature. That is the regression #792 reports, reproduced here without
# any HTTP/2 dependency in the graph.
wireframe = { path = "../../", default-features = false, features = ["pool", "serializer-bincode"] }
# `tokio-util` 0.7.20 implements `Encoder` for both `Bytes` and `&[u8]`.
# `wireframe`'s own encoder call sites name their item, so they compile under
# either implementation set. This dependency is therefore left at its plain
# implicit SemVer-compatible requirement instead of an exact pin, and resolves
# independently of the root lock.
tokio-util = "0.7.19"

[lib]
name = "wireframe_feature_gate"
path = "src/lib.rs"

# The negative half: a binary whose body is exactly the two gated calls. It is
# declared regardless of features so the package stays a plain `cargo check`
# target; it compiles only while `test-support` is off, and the check script
# requires that failure to name both methods.
[[bin]]
name = "support-accessors-probe"
path = "src/support_accessors_probe.rs"
required-features = []

[features]
# Mirrors the opt-in that adds the accessors to the published library.
test-support = ["wireframe/test-support"]

# The lints are copied rather than inherited: `[workspace]` above gives this
# package no parent table to inherit from, and an unresolved
# `[lints] workspace = true` fails the manifest. Keep this copy in step with
# the root `[workspace.lints.*]` tables, which are the `leynos/netsuke`
# baseline plus Wireframe's stricter settings.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "deny"
cognitive_complexity = "deny"
needless_pass_by_value = "deny"
implicit_hasher = "deny"
# `clippy.toml` lists the prohibited `std::env` APIs; deny the lint so this
# standalone package matches the workspace policy.
disallowed_methods = "deny"
missing_assert_message = "deny"

# 2. debugging leftovers
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# 3. panic-prone operations
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"

# 4. portability
host_endian_bytes = "deny"
little_endian_bytes = "deny"
big_endian_bytes = "deny"

# 5. nursery idiom polish
let_underscore_must_use = "deny"
or_fun_call = "deny"
option_if_let_else = "deny"
self_named_module_files = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_lit_as_bytes = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
use_self = "deny"

# 6. numerical foot-guns
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
lossy_float_literal = "deny"

# 7. API ergonomics
missing_const_for_fn = "deny"
must_use_candidate = "deny"
unused_async = "deny"
missing_docs_in_private_items = "deny"

# 8. error handling
missing_panics_doc = "deny"
error_impl_error = "deny"
result_large_err = "deny"

[lints.rust]
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(coverage)',
    'cfg(docsrs)',
    'cfg(kani)',
    'cfg(dylint_lib, values(any()))',
] }

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
unescaped_backticks = "deny"
