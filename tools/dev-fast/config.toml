# Explicit Cargo configuration for routine debug builds through Make.
# This file stays outside .cargo/ so release, coverage, verification, and
# Whitaker keep their own codegen backend. Direct Cargo
# commands do not select this fragment automatically.

[unstable]
codegen-backend = true

# Cranelift improves compilation time at the expense of runtime performance.
[profile.dev]
codegen-backend = "cranelift"

# On nightly-2026-03-26, an intentionally panicking thread aborts under
# Cranelift and a runnable doctest fails to link AWS-LC. Keep tests on LLVM;
# the explicit fragment still selects the debug build policy.
[profile.test]
codegen-backend = "llvm"

# No `[target.<...>]` table appears here. The build standard's parallel
# frontend and `mold` linker live in `.cargo/config.toml`, which Cargo reads for
# every build, and the Makefile restates them where it assigns `RUSTFLAGS`.
# This fragment carries only the development backend, which stays opt-in
# because Cranelift is a recorded exception on the pinned toolchain.
