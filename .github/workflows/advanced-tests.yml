name: Advanced Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  advanced:
    # Scheduled, so GitHub-hosted, where public-repository minutes are free.
    #
    # The ceiling is a judgement, not a measurement: this lane has failed every
    # night since at least 2026-09-09 (the Loom breakage, wireframe#683) and
    # its last green run was 2025-10-04 at 32 s, which a Loom suite has long
    # since outgrown. Sixty minutes is generous enough not to mask the repair
    # when it lands, and can be re-sized from the first green run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          override: true
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # Loom only. The models run, rather than compile, and they run from
      # their own package: the root package's test build pulls in the TCP
      # test harness, which cannot exist under `cfg(loom)`. The other
      # `advanced-tests` targets run in `ci.yml`'s `make test`, which enables
      # every feature. `tests/workflow_contracts/loom_lane_test.py` holds the
      # step to `make test-loom` and the target to its command.
      - name: Run Loom models
        timeout-minutes: 30
        run: make test-loom
