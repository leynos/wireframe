name: delayed-pr-comment
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true
      delay_minutes:
        description: 'Minutes to wait before commenting'
        required: true
      message:
        description: 'Comment body'
        required: true

jobs:
  delay_and_comment:
    # Delayed-comment lane, so GitHub-hosted, where public-repository minutes
    # are free.
    #
    # Deliberately NO `timeout-minutes`. This job's entire duration is a
    # `sleep` of the caller's `delay_minutes` input, so any fixed ceiling
    # cancels a legitimate longer delay: the ceiling would fire exactly when
    # the delay became interesting, which is the failure it exists to prevent
    # inverted. GitHub's six-hour default costs nothing here because the lane
    # is not on a per-minute runner. `ci_runner_placement_test.py` asserts the
    # absence with this reason, so it reads as a decision rather than a gap.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # needed to post comments
    steps:
      - name: Convert minutes to seconds
        id: calc
        run: echo "secs=$(( ${{ github.event.inputs.delay_minutes }} * 60 ))" >> "$GITHUB_OUTPUT"
      - name: Wait requested time
        run: sleep ${{ steps.calc.outputs.secs }}
        shell: bash
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ github.event.inputs.pr_number }}
          message: ${{ github.event.inputs.message }}
