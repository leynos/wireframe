name: delayed-pr-comment
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true
        type: number
      delay_minutes:
        description: 'Minutes to wait before commenting (0 to 345)'
        required: true
        type: number
      message:
        description: 'Comment body'
        required: true
        type: string

jobs:
  delayed-comment:
    permissions:
      pull-requests: write # needed to post comments
    uses: leynos/shared-actions/.github/workflows/delayed-pr-comment.yml@ab6505246c6b043b742a225e428e00448c0a37af # shared-actions PR 706 merge, 2026-11-24
    with:
      pr_number: ${{ inputs.pr_number }}
      delay_minutes: ${{ inputs.delay_minutes }}
      message: ${{ inputs.message }}
