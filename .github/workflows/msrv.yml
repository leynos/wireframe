name: MSRV

# Proves that the `rust-version` in Cargo.toml still compiles, as concordat
# RT-026 requires of every declared MSRV. CI otherwise uses the pinned nightly,
# so nothing else would notice code adopting a newer feature. It runs on every
# pull request and push to main, so a change that raises the floor fails before
# it merges, and weekly as well, because a dependency release can break the
# minimum without any commit here. `scripts/check-msrv.sh` explains the two
# checks.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

# A second push to a pull request supersedes the run already in flight. Every
# other event falls back to its own run id, so scheduled runs never replace one
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

jobs:
  msrv:
    # GitHub-hosted, where public-repository minutes are free; one
    # `cargo check` needs nothing the paid pool offers.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check on the declared minimum Rust version
        run: make test-msrv
