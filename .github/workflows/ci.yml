name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    # The one developer-blocking lane, so the one that moves. It waited 461 s
    # for a GitHub-hosted runner on 2026-09-16 to do 556 s of work.
    #
    # A pull request from a fork cannot obtain an Ubicloud runner, so the
    # expression falls back to a GitHub-hosted one for forks only. The
    # continuation line sits at the SAME indent as the line above it: a
    # more-indented continuation in a folded scalar keeps its line break and
    # puts a newline inside the expression, which GitHub evaluates anyway, so
    # a green run would not show it.
    #
    # This lane was previously pinned to `ubuntu-latest` by a contract whose
    # stated reason was Whitaker's prebuilt cargo-dylint. That constraint is
    # about the Namespace image, not about non-GitHub-hosted runners:
    # repovec-appliance runs the same `whitaker-installer` 0.2.6 on
    # `ubicloud-standard-4`, and previously `ubicloud-standard-2`, green.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
    steps:
      # Full history is required for the CodeScene `cs-coverage check` gate,
      # which diffs a pull request against its merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt

      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          # `runner.environment` joins the key because this lane now runs on
          # two runner environments: Ubicloud normally, GitHub-hosted on a
          # fork's pull request. The cached artefact is a compiled binary, and
          # `whitaker-installer` requires glibc 2.39, so restoring one built
          # against a newer image onto an older one fails at run time rather
          # than at restore. Both images are Ubuntu 24.04 today, so the key
          # would not collide yet; it is keyed now because the lane gained a
          # second environment in the same change that could later gain a
          # second glibc.
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          if command -v whitaker-installer >/dev/null 2>&1; then
            echo "whitaker-installer already present; skipping cargo binstall"
          else
            cargo binstall --no-confirm whitaker-installer@${{ env.WHITAKER_INSTALLER_VERSION }}
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Rust for Merman
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Install Merman CLI
        run: cargo +1.95.0 install merman-cli --version "=0.7.0" --locked
      - name: Install Nixie
        run: uv tool install --python 3.14 "nixie-cli==1.1.0"
      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Enforce en-GB-oxendict spelling
        # `make markdownlint` carried the spelling gate as a prerequisite;
        # the action replaced that step, so spelling runs on its own here.
        run: make spelling
      - name: Validate Mermaid diagrams
        run: make nixie
      - name: Workflow contract tests
        run: make test-workflow-contracts
      # Coverage runs on pull requests only and drives the ratchet gate.
      # Main-branch coverage — the CodeScene upload plus the authoritative
      # ratchet baseline every pull request compares against — is produced
      # by coverage-main.yml on push, so generation is kept out of
      # main-push runs to avoid doing the work twice.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/68308
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
