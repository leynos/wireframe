name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push. This workflow also
# advances the coverage ratchet baseline: caches saved on main are
# readable by every pull-request run, so the baseline written here is the
# one PR ratchet checks compare against.
#
# This is the only workflow in the repository that may touch CodeScene. It
# is not a pull-request lane, so a CodeScene CLI or format change cannot
# block a merge here; it can only delay a coverage upload. The changed-line
# gate on a pull request is CodeScene's own check, driven by what this
# workflow uploads.

on:
  push:
    branches: [main]

# One publisher at a time, and never cancelled. Two pushes to main in quick
# succession would otherwise upload concurrently and leave the ratchet
# baseline set by whichever finished last, which need not be the later commit.
# `cancel-in-progress` is deliberately false: a cancelled run here leaves the
# baseline describing a commit that is no longer the tip, and nothing reports
# that.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # The Coverage job of the three-way split of trunk coverage: it measures
    # and uploads, and blocks no one's work (user ruling, 7 November), so it
    # runs on a GitHub-hosted runner (four vCPU, as the Ubicloud shape it
    # replaces was). It saves nothing to a cache and runs no ratchet: a hosted
    # job's cache store is not the one the Ubicloud pull-request lane reads, so
    # the baseline is handed to `coverage-baseline` below, and
    # `coverage-warmup` keeps the compiler cache that lane reads warm. It
    # compiles cold, which is why the ceiling is wider than the warm Ubicloud
    # run's was. `push` carries no pull request, so there is no fork arm.
    runs-on: ubuntu-24.04
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      # CodeScene derives github.com/leynos/wireframe from this checkout's
      # origin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leynos/wireframe
          persist-credentials: false
      # `.cargo/config.toml` selects `mold` for every Linux build, including
      # the scratch crates the trybuild case compiles under `target/`, so the
      # runner needs the linker before coverage runs. The input installs it
      # and sets no flag; the Cargo configuration does that.
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          install-mold: 'true'
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # Measure and hand over; the ratchet and the save belong to
          # `coverage-baseline`, on the runner whose cache the lane reads.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
          # The same watchdog as `ci.yml`, and for the same reason: it bounds
          # the whole cargo run, sits outside the nextest global-timeout
          # (600 s) and inside this job's 20-minute ceiling.
          cargo-wait-timeout: '900'
          # A new path starts a new baseline: the cache entry's version hashes
          # this path, so the restore misses the 89.0% measured on the previous
          # toolchain and the committed file sets the baseline.
          baseline-rust-file: .coverage-baseline-v2.rust
      # Reports whether the token is configured without binding it anywhere:
      # the expression is evaluated before the shell runs, so this step
      # writes `available=true` or `available=false` and the token is in no
      # `env`. The uploader is a composite action that hands its step's `env`
      # to nested steps, so the token goes to it as an input instead.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # The ref test is not redundant with the trigger above, it is what
        # keeps the trigger honest. `push.branches` is `[main]` today and
        # there is no `workflow_dispatch`, so `github.ref` cannot be anything
        # else; the moment either changes, a dispatch from a feature branch
        # would publish that branch's coverage as the trunk's, because
        # CodeScene accepts an upload for the analysed branch whatever the
        # payload came from. Both are pinned by the contract so neither can
        # move without the other being reconsidered.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        # a5765019 is the floor: from it the uploader selects the CodeScene
        # CLI from a committed manifest. Earlier revisions install "latest",
        # which no longer resolves.
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          format: lcov
          # Stated rather than left to the action's default, because this
          # being the upload and not the pull-request check is the whole
          # point of the split.
          mode: upload
          # This is now the only place the project is named: ci.yml's gate
          # is gone, so there is no second identity to stay aligned with.
          project-url: https://api.codescene.io/v2/projects/68308
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

  # Ratchets the figure `coverage-upload` handed over and saves the baseline
  # the Ubicloud pull-request lane restores. It runs only if the coverage job
  # passed, so the baseline never advances from a failed run, and it compiles
  # nothing. It carries no `if`: the action publishes only from a push.
  coverage-baseline:
    needs: coverage-upload
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          artefact-name: coverage-baseline-handover
          baseline-rust-file: .coverage-baseline-v2.rust

  # Compiles the instrumented tests the pull-request lane builds, without
  # running them, so that lane's compiler-cache reads hit. It runs on the
  # lane's own runner shape and depends on nothing: a failing test is no
  # reason to leave the cache cold.
  coverage-warmup:
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          install-mold: 'true'
      - name: Compile the instrumented tests
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          output-path: lcov.info
          format: lcov
          build-only: 'true'
          # The same watchdog as the coverage step and the lane, inside this
          # job's ceiling.
          cargo-wait-timeout: '900'
