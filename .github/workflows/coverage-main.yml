name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push. This workflow also
# advances the coverage ratchet baseline: caches saved on main are
# readable by every pull-request run, so the baseline written here is the
# one PR ratchet checks compare against.
#
# This is the only workflow in the repository that may touch CodeScene. It
# is not a pull-request lane, so a CodeScene CLI or format change cannot
# block a merge here; it can only delay a coverage upload. The changed-line
# gate on a pull request is CodeScene's own check, driven by what this
# workflow uploads.

on:
  push:
    branches: [main]

# One publisher at a time, and never cancelled. Two pushes to main in quick
# succession would otherwise upload concurrently and leave the ratchet
# baseline set by whichever finished last, which need not be the later commit.
# `cancel-in-progress` is deliberately false: a cancelled run here leaves the
# baseline describing a commit that is no longer the tip, and nothing reports
# that.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # A push lane, so Ubicloud rather than GitHub-hosted. There is no fork
    # arm: `push` carries no pull request, so the guard would be constant
    # here and a constant guard reads as a decision nobody made.
    #
    # Four vCPU for the same reason `ci.yml` is: this lane runs the same
    # `generate-coverage` over the same workspace, so it runs the same
    # trybuild case that nextest killed at 180 s on two vCPU. Its 240 s
    # sample was taken on Namespace's shared profile, which is four vCPU and
    # 16 GB, so two was never the shape it had been measured on. Sizing it
    # down would have failed on the first merge push after this merged, with
    # nobody watching.
    runs-on: ubicloud-standard-4
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      # CodeScene derives github.com/leynos/wireframe from this checkout's
      # origin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leynos/wireframe
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@dbe2e22ceaf498d85512679ccded38be9dbe7777
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Reports whether the token is configured without binding it anywhere:
      # the expression is evaluated before the shell runs, so this step
      # writes `available=true` or `available=false` and the token is in no
      # `env`. The uploader is a composite action that hands its step's `env`
      # to nested steps, so the token goes to it as an input instead.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # The ref test is not redundant with the trigger above, it is what
        # keeps the trigger honest. `push.branches` is `[main]` today and
        # there is no `workflow_dispatch`, so `github.ref` cannot be anything
        # else; the moment either changes, a dispatch from a feature branch
        # would publish that branch's coverage as the trunk's, because
        # CodeScene accepts an upload for the analysed branch whatever the
        # payload came from. Both are pinned by the contract so neither can
        # move without the other being reconsidered.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        # a5765019 is the floor: from it the uploader selects the CodeScene
        # CLI from a committed manifest. Earlier revisions install "latest",
        # which no longer resolves.
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: lcov
          # Stated rather than left to the action's default, because this
          # being the upload and not the pull-request check is the whole
          # point of the split.
          mode: upload
          # This is now the only place the project is named: ci.yml's gate
          # is gone, so there is no second identity to stay aligned with.
          project-url: https://api.codescene.io/v2/projects/68308
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
