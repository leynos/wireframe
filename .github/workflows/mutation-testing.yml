name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow (see
# ADR-007 and leynos/shared-actions docs/mutation-cargo-workflow.md).
# Scheduled runs mutate only files changed within the detection window;
# manual dispatch runs mutate everything, fanned out across shards. To
# test a branch, select it in the Actions "Run workflow" control.

on:
  schedule:
    - cron: "30 4 * * *" # Daily, 04:30 UTC
  workflow_dispatch:

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

# Serialize runs per ref: a dispatch during a scheduled run (or vice
# versa) queues rather than racing. Runs are informational, so queued
# runs wait instead of cancelling.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@203eedc136c14c28041e92c06a929383807b3a3f
    with:
      # Mutate the companion crate too; `make test-doc` keeps the doctests in
      # its unmutated baseline compiling (#578).
      extra-crate-dirs: "wireframe_testing"
      # Illustrative codecs and test-support scaffolding whose
      # survivors are noise (#571). The `src/test_helpers.rs` glob only
      # matches the module root; `src/test_helpers/**` also covers the
      # helper submodules (frame_codec.rs, pool_client.rs). `src/**/tests.rs`
      # covers the cfg(test)-only test modules split into companion files,
      # which cargo-mutants cannot detect as test code (#599).
      exclude-globs: "src/codec/examples.rs,src/test_helpers.rs,src/test_helpers/**,src/connection/test_support.rs,src/**/tests.rs"
      # Match the CI baseline (`make test` runs --all-features) so
      # feature-gated tests run against mutants (#571).
      extra-args: "--all-features"
      # Eight shards: the first six-shard dispatch run (Stage E) lost
      # shard 2 to the 300-minute ceiling because timeout-prone mutants
      # cluster unevenly; extra shards buy headroom.
      shard-count: 8
