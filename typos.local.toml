schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Inline code spans are masked; the shared dictionary does not mask them yet.
  '`[^`\n]+`',
  # Preserve the external Linux linker name only in its command and flag forms.
  "-Clink-arg=-fuse-ld=mold",
  "sudo apt-get install -y mold",
  "mold --version",
  # Published test-server identifiers retain their public spellings.
  "\\bPoolServerBehavior\\b",
  "\\bstart_with_behavior\\b",
  # Fixed CI and Tokio identifiers keep their external spellings.
  "\\ \\ \\ \\ \\ \\ CARGO_TERM_COLOR:\\ always",
  "\\ reopened,\\ synchronize,\\ labeled,\\ ready_for_review\\]",
  "\\#\\[tokio::test\\(flavor\\ =\\ \"current_thread\",\\ sta",
  "\\#\\[tokio::test\\(flavor\\ =\\ \"current_thread\"\\)\\]",
  # Migration documentation records the immutable former public method name.
  "BackoffConfig::normalised",
  # RFC generic-bound examples use the declared `Ser` parameter only in these
  # exact type fragments, without accepting the bare word elsewhere.
  "AppFactory<Ser,",
  "Ser: Serializer",
  "DecodeWith<Ser>",
  "EncodeWith<Ser>",
  "st\\(start_paused\\ =\\ true,\\ flavor\\ =\\ \"current_thread\"\\)\\]",
]

[files]
exclude = []
